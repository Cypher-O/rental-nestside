name: rental_mobile
description: A production-grade rental system mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  flutter_dotenv: ^5.2.1
  flutter_paystack:
    git:
      url: https://github.com/novaji-introserve/flutter_paystack.git
      ref: 76cb178
  google_fonts: ^6.2.1

dependency_overrides:
  intl: ^0.19.0
  http: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env
    - .env.dev

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/nestfinder_icon.png"
  adaptive_icon_background: "#18181B"
  adaptive_icon_foreground: "assets/icons/nestfinder_icon.png"
